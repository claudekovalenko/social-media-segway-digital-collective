<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Signup — Your Funnel Link</title>
  <script>(function(){var d=document.documentElement;d.classList.add("js");window.__fontsIn=function(){d.classList.add("fonts-in")};window.__fontsIn()})();</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest?v=jp2">
  <meta name="theme-color" content="#F5F0E7">
  <link rel="icon" href="favicon.ico?v=jp2" sizes="32x32">
  <link rel="icon" href="icons/icon.svg?v=jp2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=jp2">
</head>
<body class="ig jpn">
  <div class="wrap">
    <nav class="site-nav">
      <a class="brand" href="index.html"><img class="brand-logo" src="logo.png" alt="Jesus People Network" width="608" height="160"></a>
    </nav>
    <header class="hero">
      <h1>Get your funnel link</h1>
      <p class="hero-sub">One link for your audience. Everyone who responds is tracked to you.</p>
    </header>

    <section class="step-card open static">
      <form id="creatorForm">
        <label>Your name or channel<input name="name" required maxlength="100" placeholder="e.g. Sarah Kim"></label>
        <label>Your link name
          <input name="slug" required maxlength="40" pattern="[a-zA-Z0-9-]+" placeholder="faith-with-sarah">
        </label>
        <label>Your email
          <input name="email" type="email" required maxlength="200" placeholder="you@example.com">
        </label>
        <label>Your public handle
          <input name="handle" maxlength="60" placeholder="@faithwithsarah">
        </label>
        <label>What you're known for
          <input name="topic" maxlength="60" placeholder="e.g. Testimonies, Apologetics, Worship">
        </label>
        <label>Content mode
          <select name="mode" id="modeSelect">
            <option value="default">Use the default videos</option>
            <option value="custom">Use my own videos</option>
          </select>
        </label>
        <div id="customFields" class="custom-fields" style="display:none;">
          <label>&ldquo;Know God&rdquo; video URL<input name="know_god_video_url" type="url" maxlength="500" placeholder="https://youtube.com/embed/&hellip;"></label>
          <label>&ldquo;Grow with God&rdquo; course URL<input name="grow_course_url" type="url" maxlength="500" placeholder="https://&hellip;"></label>
          <label>&ldquo;Get Connected&rdquo; video URL<input name="find_church_video_url" type="url" maxlength="500" placeholder="https://&hellip;"></label>
        </div>
        <button type="submit">Create my link</button>
        <div class="success" id="result"></div>
        <div class="error"></div>
      </form>
    </section>

    <footer><p><a href="index.html">&larr; Back to Jesus People Network</a></p></footer>
  </div>

  <script>
    // Pages has no backend of its own — send API calls to the Worker.
    const API_BASE = location.hostname.endsWith('github.io')
      ? 'https://faith-journey-funnel.faith-journey-funnel.workers.dev'
      : '';

    const modeSelect = document.getElementById('modeSelect');
    const customFields = document.getElementById('customFields');
    modeSelect.addEventListener('change', () => {
      customFields.style.display = modeSelect.value === 'custom' ? 'block' : 'none';
    });

    const form = document.getElementById('creatorForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const result = document.getElementById('result');
      const error = form.querySelector('.error');
      result.style.display = error.style.display = 'none';
      try {
        const res = await fetch(API_BASE + '/api/creators/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Something went wrong');
        const link = (API_BASE || location.origin) + body.link;
        result.replaceChildren();
        const p1 = document.createElement('p');
        const a = document.createElement('a'); a.href = link; a.textContent = link;
        p1.append('Your link is ready: ', a, ' — put it in your bio!');
        const p2 = document.createElement('p');
        p2.className = 'access-key-box';
        const code = document.createElement('code'); code.textContent = body.access_key;
        p2.append('Your access key (save it now — it is shown only once): ', code);
        const p3 = document.createElement('p');
        const d = document.createElement('a'); d.href = 'dashboard.html'; d.textContent = 'your dashboard';
        p3.append('Sign in at ', d, ' with your email — the key above is a backup.');
        result.append(p1, p2, p3);
        result.style.display = 'grid';
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      }
    });
  </script>
  <script>// Nothing is cached on the device any more. This only re-registers where a
    // worker is already installed, so that device picks up sw.js and clears
    // itself out. A first-time visitor registers nothing and loads once.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => { if (regs.length) navigator.serviceWorker.register("sw.js"); })
        .catch(() => {});
    }</script>
  <script src="/kc-notes.js" data-api="https://kovalenko-creatives.pages.dev" defer></script>
</body>
</html>

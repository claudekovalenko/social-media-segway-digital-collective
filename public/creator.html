<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Signup — Your Funnel Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>Get your funnel link</h1>
      <p class="hero-sub">One link for your audience. Everyone who responds is tracked to you.</p>
    </header>

    <section class="step-card open static">
      <form id="creatorForm">
        <label>Your name or channel<input name="name" required maxlength="100" placeholder="e.g. Sarah Kim"></label>
        <label>Your link name
          <input name="slug" required maxlength="40" pattern="[a-zA-Z0-9-]+" placeholder="faith-with-sarah">
        </label>
        <label>Content mode
          <select name="mode" id="modeSelect">
            <option value="default">Use the default videos</option>
            <option value="custom">Use my own videos</option>
          </select>
        </label>
        <div id="customFields" class="custom-fields" style="display:none;">
          <label>&ldquo;Know God&rdquo; video URL<input name="know_god_video_url" type="url" maxlength="500" placeholder="https://youtube.com/embed/&hellip;"></label>
          <label>&ldquo;Grow with God&rdquo; course URL<input name="grow_course_url" type="url" maxlength="500" placeholder="https://&hellip;"></label>
          <label>&ldquo;Gather Locally&rdquo; video URL<input name="find_church_video_url" type="url" maxlength="500" placeholder="https://&hellip;"></label>
        </div>
        <button type="submit">Create my link</button>
        <div class="success" id="result"></div>
        <div class="error"></div>
      </form>
    </section>

    <footer><p><a href="./">&larr; Back to the steps</a></p></footer>
  </div>

  <script>
    // Pages has no backend of its own — send API calls to the Worker.
    const API_BASE = location.hostname.endsWith('github.io')
      ? 'https://faith-journey-funnel.faith-journey-funnel.workers.dev'
      : '';

    const modeSelect = document.getElementById('modeSelect');
    const customFields = document.getElementById('customFields');
    modeSelect.addEventListener('change', () => {
      customFields.style.display = modeSelect.value === 'custom' ? 'block' : 'none';
    });

    const form = document.getElementById('creatorForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const result = document.getElementById('result');
      const error = form.querySelector('.error');
      result.style.display = error.style.display = 'none';
      try {
        const res = await fetch(API_BASE + '/api/creators/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Something went wrong');
        const link = (API_BASE || location.origin) + body.link;
        result.innerHTML = `Your link is ready: <a href="${link}">${link}</a> — put it in your bio!`;
        result.style.display = 'block';
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      }
    });
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>

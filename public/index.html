<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Next Step</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>Take Your<br><span class="alt">Next Step</span></h1>
      <span class="creator-badge" id="creatorBadge" hidden></span>
    </header>

    <div class="steps">
      <!-- STEP 1: Know God -->
      <section class="step-card" id="card-know_god">
        <span class="num">1</span><h2>Know God</h2>
        <div class="step-body">
          <div id="video-know_god"></div>
          <form data-step="know_god">
            <input name="name" required maxlength="100" placeholder="Name" aria-label="Name">
            <input name="email" type="email" required maxlength="200" placeholder="Email" aria-label="Email">
            <select name="decision" aria-label="Where are you in this journey?">
              <option value="" disabled selected>Where are you today?</option>
              <option value="first_time">I just decided to follow Jesus</option>
              <option value="recommitment">I'm recommitting my life</option>
              <option value="questions">I have questions</option>
              <option value="exploring">Just exploring</option>
            </select>
            <label class="check"><input type="checkbox" name="interested_in_group"> Connect me with a small group</label>
            <button type="submit">I took this step</button>
            <div class="success">Welcome to the family. We’ll be in touch soon.</div>
            <div class="error"></div>
          </form>
        </div>
      </section>

      <!-- STEP 2: Grow with God -->
      <section class="step-card" id="card-grow_with_god">
        <span class="num">2</span><h2>Grow with God</h2>
        <div class="step-body">
          <div id="video-grow_with_god"></div>
          <form data-step="grow_with_god">
            <input name="name" required maxlength="100" placeholder="Name" aria-label="Name">
            <input name="email" type="email" required maxlength="200" placeholder="Email" aria-label="Email">
            <label class="check"><input type="checkbox" name="interested_in_group"> Do it with a small group</label>
            <button type="submit">Start the course</button>
            <div class="success">You’re in. Check your email for the first lesson.</div>
            <div class="error"></div>
          </form>
        </div>
      </section>

      <!-- STEP 3: Find a Faith Family -->
      <section class="step-card" id="card-find_church">
        <span class="num">3</span><h2>Find a Faith Family</h2>
        <div class="step-body">
          <div id="video-find_church"></div>
          <form data-step="find_church">
            <input name="name" required maxlength="100" placeholder="Name" aria-label="Name">
            <input name="email" type="email" required maxlength="200" placeholder="Email" aria-label="Email">
            <input name="city" required maxlength="100" placeholder="City" aria-label="City">
            <label class="check"><input type="checkbox" name="interested_in_group"> Connect me with others near me</label>
            <button type="submit">Help me find a church</button>
            <div class="success">Got it — we’ll help you find a church near you.</div>
            <div class="error"></div>
          </form>
        </div>
      </section>
    </div>

    <footer>
      <p><a href="/creator.html">Creators: get your link</a></p>
    </footer>
  </div>
  <script src="/app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>

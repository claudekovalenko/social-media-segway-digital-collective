name: Front-end checks

# The checker. Every push runs tests/smoke.mjs in a real browser against the
# pages in this commit (mocked API), and again against the live site once the
# Worker deploy has finished. A failure fails the run, uploads screenshots of
# every page, and opens (or updates) one issue titled "Front-end checks failed"
# so it is impossible to miss. The issue closes itself on the next green run.

on:
  push:
    branches: [claude/know-god-creator-website-vjvm2i]
    paths-ignore: ['README.md', 'supabase/**']
  pull_request:
  workflow_run:
    workflows: ["Deploy Worker to Cloudflare"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: Check a specific site (blank = local pages with mocked API)
        required: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # After a deploy: only if the deploy itself succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the checks
        env:
          BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://faith-journey-funnel.faith-journey-funnel.workers.dev' || inputs.base_url || '' }}
        run: node tests/smoke.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.run_id }}
          path: tests/out
          retention-days: 14
      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'The front-end checker found a problem.\n\n';
            try {
              const r = JSON.parse(fs.readFileSync('tests/out/results.json', 'utf8'));
              body += `Checked: ${r.base}\n\n`;
              for (const x of r.results) body += `- ${x.ok ? '✅' : '❌'} ${x.name}${x.ok ? '' : ' — ' + x.error}\n`;
            } catch { body += 'The run did not get as far as producing results.\n'; }
            body += `\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} (screenshots are attached to the run)\nCommit: ${context.sha}`;
            const title = 'Front-end checks failed';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'front-end-checks' });
            const existing = open.find((i) => i.title === title);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['front-end-checks'] });
      - name: Close the failure issue when green again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'front-end-checks' });
            for (const i of open) if (i.title === 'Front-end checks failed') {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `All checks pass again on ${context.sha}.` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' });
            }

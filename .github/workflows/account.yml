name: Create or reset an account

# Run from the Actions tab. Creates the account through the live site's own
# API (so the password is hashed exactly as the site does it), or, if the
# account already exists, resets its password and tier. Authenticates with
# the ADMIN_KEY repo secret; nothing else is needed.

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email or username
        required: true
      password:
        description: Password
        required: true
      role:
        description: Tier
        required: true
        default: admin
        type: choice
        options: [admin, creator, pending]
      name:
        description: Full name (optional)
        required: false
      creator_slug:
        description: Link name for a creator (optional, e.g. craigbrown)
        required: false
      admin_email:
        description: An existing admin's email (to authorize this)
        required: true
      admin_password:
        description: That admin's password (masked in the log)
        required: true

jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      # Masking has to happen in a step before the one whose env header
      # would print the values.
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ inputs.password }}"
          echo "::add-mask::${{ inputs.admin_password }}"
      - name: Create or reset
        env:
          SITE: https://faith-journey-funnel.faith-journey-funnel.workers.dev
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          EMAIL: ${{ inputs.email }}
          PASSWORD: ${{ inputs.password }}
          ROLE: ${{ inputs.role }}
          NAME: ${{ inputs.name }}
          SLUG: ${{ inputs.creator_slug }}
        run: |
          login=$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')
          TOKEN=$(curl -s -X POST "$SITE/api/admin/login" -H "content-type: application/json" --data "$login" | jq -r '.token // empty')
          [ -n "$TOKEN" ] || { echo "admin sign-in failed"; exit 1; }
          echo "::add-mask::$TOKEN"
          body=$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" --arg r "$ROLE" --arg n "$NAME" --arg s "$SLUG" '{email:$e,password:$p,role:$r,name:$n,creator_slug:$s}')
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SITE/api/admin/accounts" \
            -H "content-type: application/json" -H "authorization: Bearer $TOKEN" --data "$body")
          echo "create: $code $(jq -c 'del(.token)' /tmp/out 2>/dev/null || cat /tmp/out)"
          if [ "$code" = "409" ]; then
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SITE/api/admin/accounts/password" \
              -H "content-type: application/json" -H "authorization: Bearer $TOKEN" --data "$body")
            echo "password: $code $(cat /tmp/out)"
            case "$code" in 200|201) ;; *) exit 1;; esac
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SITE/api/admin/accounts/role" \
              -H "content-type: application/json" -H "authorization: Bearer $TOKEN" --data "$body")
            echo "role: $code $(cat /tmp/out)"
          fi
          case "$code" in 200|201) ;; *) exit 1;; esac

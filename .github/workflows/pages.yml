name: Deploy to GitHub Pages

# Publishes the public/ folder to GitHub Pages.
# NOTE: Pages serves static files only — form submissions, creator links and the
# admin dashboard need the Cloudflare Worker (see README). Point PUBLIC API_BASE
# in public/app.js at the Worker URL if you serve the pages from here.

on:
  push:
    branches: [claude/know-god-creator-website-vjvm2i]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

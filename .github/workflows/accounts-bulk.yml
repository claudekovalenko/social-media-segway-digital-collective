name: Create creator accounts in bulk

# Run from the Actions tab (Run workflow). Uses accounts/people.txt unless a
# list is pasted. Signs in as the admin saved in the ADMIN_EMAIL and
# ADMIN_PASSWORD repo secrets, unless an admin email/password is typed into
# the form. One person per line:
#
#   First Last @instagramhandle [photo: YouTube channel or Instagram profile]
#
# Each line becomes a creator account on the live site:
#   - sign-in:  firstlast@digitalcollective.com (lowercase, letters only)
#   - password: their first name, lowercase
#   - link:     /c/<handle>, using the platform's default videos
#   - photo:    the address listed, if any (a YouTube channel falls back to
#               their Instagram when YouTube gives no picture); none if not
#
# Lines that already have an account are skipped, not reset. Goes through
# the site's own API, the same way the single "Create or reset an account"
# workflow does.

on:
  workflow_dispatch:
    inputs:
      people:
        description: 'One per line (or separated by ;): First Last @handle. Empty = accounts/people.txt'
        required: false
      admin_email:
        description: An admin's email (optional; the ADMIN_EMAIL repo secret is used otherwise)
        required: false
      admin_password:
        description: That admin's password (masked in the log)
        required: false
      videos_from:
        description: Copy the three videos from this creator's page (link name) to anyone who has none of their own
        required: false
        default: acraigbrown
      dry_run:
        description: Only show what would be created
        type: boolean
        default: false

jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets
        env:
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: '[ -z "$ADMIN_PASSWORD" ] || echo "::add-mask::$ADMIN_PASSWORD"' 
      - uses: actions/checkout@v4
      - name: Create accounts
        env:
          SITE: https://faith-journey-funnel.faith-journey-funnel.workers.dev
          DOMAIN: digitalcollective.com
          FORM_EMAIL: ${{ inputs.admin_email }}
          FORM_PASSWORD: ${{ inputs.admin_password }}
          SAVED_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SAVED_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PEOPLE: ${{ inputs.people }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          VIDEOS_FROM: ${{ inputs.videos_from }}
        run: |
          if [ -z "$PEOPLE" ]; then PEOPLE=$(grep -v '^[[:space:]]*#' accounts/people.txt || true); fi
          # The typed pair, or else the saved pair; never one of each.
          if [ -n "$FORM_EMAIL" ]; then ADMIN_EMAIL=$FORM_EMAIL; ADMIN_PASSWORD=$FORM_PASSWORD
          else ADMIN_EMAIL=$SAVED_EMAIL; ADMIN_PASSWORD=$SAVED_PASSWORD; fi
          if [ "$DRY_RUN" != "true" ]; then
            if [ -n "$ADMIN_EMAIL" ]; then
              login=$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')
              TOKEN=$(curl -s -X POST "$SITE/api/admin/login" -H "content-type: application/json" --data "$login" | jq -r '.token // empty')
              [ -n "$TOKEN" ] || { echo "admin sign-in failed"; exit 1; }
              echo "::add-mask::$TOKEN"
              AUTH="authorization: Bearer $TOKEN"
            elif [ -n "$ADMIN_KEY" ]; then
              AUTH="x-admin-key: $ADMIN_KEY"
            else
              echo "No admin sign-in: add the ADMIN_EMAIL and ADMIN_PASSWORD repo secrets, or type them into the form"; exit 1
            fi
          fi

          # Read the list first, so a reader failure fails the run.
          printf '%s\n' "$PEOPLE" | tr ';' '\n' | node accounts/people.mjs - > /tmp/people.jsonl
          # The videos to copy, read from that creator's public page.
          VIDEO_KEYS='["know_god_video_url","grow_video_url","find_church_video_url"]'
          source='{}'
          if [ -n "$VIDEOS_FROM" ]; then
            source=$(curl -s "$SITE/api/creators/$VIDEOS_FROM")
            jq -e '(.creator // .).slug' <<<"$source" >/dev/null || { echo "No creator page '$VIDEOS_FROM' to copy videos from."; exit 1; }
            echo "Videos from /c/$VIDEOS_FROM:"
            jq -r --argjson keys "$VIDEO_KEYS" '(.creator // .) as $c | $keys[] | "  \(.): \($c[.] // "(none: uses the collective default)")"' <<<"$source"
            echo
          fi

          # What to fill in on someone's page: only fields they haven't set.
          #   - the listed photo
          #   - their creator card (the button at the foot) → their Instagram
          #   - the videos copied from $VIDEOS_FROM
          fill_for() {  # slug handle photo → JSON of fields to set ({} if none)
            cur=$(curl -s "$SITE/api/creators/$1"); jq -e . >/dev/null 2>&1 <<<"$cur" || cur='{}'
            jq -nc --argjson src "$source" --argjson cur "$cur" --argjson keys "$VIDEO_KEYS" \
                   --arg ig "https://www.instagram.com/$2/" --arg photo "$3" '
              ($cur.creator // $cur) as $c | ($src.creator // $src) as $f |
              (reduce $keys[] as $k ({}; if (($c[$k] // "") == "") and (($f[$k] // "") != "")
                                          then .[$k] = $f[$k] else . end))
              + (if ($c.back_url // "") == "" then {back_url: $ig} else {} end)
              + (if $photo != "" and ($c.avatar_url // "") == "" then {avatar_url: $photo} else {} end)'
          }
          fill() {  # slug handle photo
            fields=$(fill_for "$1" "$2" "$3")
            [ "$fields" = '{}' ] && { echo "  page already set up"; return; }
            what=$(jq -r 'keys | map(if . == "back_url" then "card → Instagram" elif . == "avatar_url" then "photo" else sub("_url$"; "") end) | join(", ")' <<<"$fields")
            if [ "$DRY_RUN" = "true" ]; then echo "  would set: $what"; return; fi
            fbody=$(jq -c --arg s "$1" '. + {slug: $s}' <<<"$fields")
            fcode=$(curl -s -o /tmp/fill -w '%{http_code}' -X POST "$SITE/api/creator/links" \
              -H "content-type: application/json" -H "$AUTH" --data "$fbody")
            [ "$fcode" = 200 ] && echo "  set: $what" || { echo "  ✗ page not updated: $fcode $(jq -r '.error // empty' /tmp/fill 2>/dev/null)"; failed=$((failed+1)); }
          }

          created=0; skipped=0; failed=0; seen=' '
          # One reader for the list (accounts/people.mjs, also used by the
          # tests); it refuses unclear lines instead of guessing. Newlines or
          # semicolons separate people (the Actions input box is one line on
          # some browsers).
          while IFS= read -r person; do
            line=$(jq -r '.line' <<<"$person")
            if jq -e 'has("error")' <<<"$person" >/dev/null; then
              echo "✗ '$line' — $(jq -r '.error' <<<"$person")"; failed=$((failed+1)); continue
            fi
            name=$(jq -r '.name' <<<"$person"); email=$(jq -r '.email' <<<"$person")
            password=$(jq -r '.password' <<<"$person"); slug=$(jq -r '.slug' <<<"$person")
            handle=$(jq -r '.handle' <<<"$person"); photo=$(jq -r '.photo // empty' <<<"$person")
            case "$seen" in *" $email "*)
              echo "✗ $name → $email is already used by someone earlier in this list"; failed=$((failed+1)); continue ;;
            esac
            seen="$seen$email "

            if [ "$DRY_RUN" = "true" ]; then
              echo "• $name → $email  link: /c/$slug  photo: ${photo:-none}"
              fill "$slug" "$handle" "$photo"; continue
            fi

            body=$(jq -nc --arg e "$email" --arg p "$password" --arg n "$name" --arg s "$slug" --arg h "@$handle" \
              '{email:$e,password:$p,role:"creator",name:$n,creator_slug:$s,handle:$h}')
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SITE/api/admin/accounts" \
              -H "content-type: application/json" -H "$AUTH" --data "$body")
            case "$code" in
              200|201)
                echo "✓ $name → $email  link: /c/$slug  photo: ${photo:-none}"; created=$((created+1))
                fill "$slug" "$handle" "$photo"
                ;;
              409)
                # The account is left as it is; its page gets only what's missing.
                echo "– $name → $email already has an account (left as is)"; skipped=$((skipped+1))
                fill "$slug" "$handle" "$photo"
                ;;
              *)       echo "✗ $name → $email: $code $(jq -r '.error // empty' /tmp/out 2>/dev/null)"; failed=$((failed+1)) ;;
            esac
          done < /tmp/people.jsonl

          echo
          echo "created: $created  already existed: $skipped  failed: $failed"
          [ "$failed" = 0 ]

name: Create creator accounts in bulk

# Run from the Actions tab (Run workflow). Uses accounts/people.txt unless a
# list is pasted. Signs in as the admin saved in the ADMIN_EMAIL and
# ADMIN_PASSWORD repo secrets, unless an admin email/password is typed into
# the form. One person per line:
#
#   First Last @instagramhandle [photo: YouTube channel or Instagram profile]
#
# Each line becomes a creator account on the live site:
#   - sign-in:  firstlast@digitalcollective.com (lowercase, letters only)
#   - password: their first name, lowercase
#   - link:     /c/<handle>
#   - page:     the three videos copied from another creator (videos_from),
#               and the card at the foot of the page opening their Instagram
#   - photo:    the address listed, if any (a YouTube channel falls back to
#               their Instagram when YouTube gives no picture); none if not
#
# Lines that already have an account are skipped, not reset. Goes through
# the site's own API, the same way the single "Create or reset an account"
# workflow does.

on:
  workflow_dispatch:
    inputs:
      people:
        description: 'One per line (or separated by ;): First Last @handle. Empty = accounts/people.txt'
        required: false
      admin_email:
        description: An admin's email (optional; the ADMIN_EMAIL repo secret is used otherwise)
        required: false
      admin_password:
        description: That admin's password (masked in the log)
        required: false
      videos_from:
        description: New accounts get the three videos from this creator's page (link name)
        required: false
        default: acraigbrown
      fill_existing:
        description: Also fill empty videos and card link on accounts that already exist (a cleared field counts as empty; never their photo)
        type: boolean
        default: false
      update_photos:
        description: Give accounts that already exist the photo listed for them in people.txt (replaces their current one)
        type: boolean
        default: false
      dry_run:
        description: Only show what would be created
        type: boolean
        default: false

jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets
        env:
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: '[ -z "$ADMIN_PASSWORD" ] || echo "::add-mask::$ADMIN_PASSWORD"' 
      - uses: actions/checkout@v4
      - name: Create accounts
        env:
          SITE: https://faith-journey-funnel.faith-journey-funnel.workers.dev
          DOMAIN: digitalcollective.com
          FORM_EMAIL: ${{ inputs.admin_email }}
          FORM_PASSWORD: ${{ inputs.admin_password }}
          SAVED_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SAVED_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PEOPLE: ${{ inputs.people }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          VIDEOS_FROM: ${{ inputs.videos_from }}
          FILL_EXISTING: ${{ inputs.fill_existing }}
          UPDATE_PHOTOS: ${{ inputs.update_photos }}
        run: |
          if [ -z "$PEOPLE" ]; then PEOPLE=$(grep -v '^[[:space:]]*#' accounts/people.txt || true); fi
          # The typed pair, or else the saved pair; never one of each.
          if [ -n "$FORM_EMAIL" ]; then ADMIN_EMAIL=$FORM_EMAIL; ADMIN_PASSWORD=$FORM_PASSWORD
          else ADMIN_EMAIL=$SAVED_EMAIL; ADMIN_PASSWORD=$SAVED_PASSWORD; fi
          if [ "$DRY_RUN" != "true" ]; then
            if [ -n "$ADMIN_EMAIL" ]; then
              login=$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')
              TOKEN=$(curl -s -X POST "$SITE/api/admin/login" -H "content-type: application/json" --data "$login" | jq -r '.token // empty')
              [ -n "$TOKEN" ] || { echo "admin sign-in failed"; exit 1; }
              echo "::add-mask::$TOKEN"
              AUTH="authorization: Bearer $TOKEN"
            elif [ -n "$ADMIN_KEY" ]; then
              AUTH="x-admin-key: $ADMIN_KEY"
            else
              echo "No admin sign-in: add the ADMIN_EMAIL and ADMIN_PASSWORD repo secrets, or type them into the form"; exit 1
            fi
          fi

          # This run's own scratch files.
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          # Read the list first, so a reader failure fails the run.
          printf '%s\n' "$PEOPLE" | tr ';' '\n' | node accounts/people.mjs - > "$work/people.jsonl"
          # Reads a public creator page: prints it and succeeds only for a real
          # page (HTTP 200 with a slug); anything else is "could not read".
          read_page() {
            local out code
            out=$(curl -s -w '\n%{http_code}' "$SITE/api/creators/$1") || return 2
            code=${out##*$'\n'}; out=${out%$'\n'*}
            [ "$code" = 404 ] && return 1
            [ "$code" = 200 ] && jq -e 'type == "object" and ((.creator // .).slug | type == "string")' >/dev/null 2>&1 <<<"$out" || return 2
            jq -c '.creator // .' <<<"$out"
          }

          # The videos to copy (only web addresses), from that creator's page.
          VIDEO_KEYS='["know_god_video_url","grow_video_url","find_church_video_url"]'
          source='{}'
          if [ -n "$VIDEOS_FROM" ]; then
            [[ "$VIDEOS_FROM" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo "videos_from must be a creator's link name, like acraigbrown."; exit 1; }
            source=$(read_page "$VIDEOS_FROM") || { echo "Could not read the creator page '$VIDEOS_FROM' to copy videos from."; exit 1; }
            source=$(jq -c --argjson keys "$VIDEO_KEYS" '. as $c | reduce $keys[] as $k ({};
              if ($c[$k] | type) == "string" and ($c[$k] | test("^https?://")) then .[$k] = $c[$k] else . end)' <<<"$source")
            echo "Videos from /c/$VIDEOS_FROM:"
            jq -r --argjson keys "$VIDEO_KEYS" '. as $c | $keys[] | "  \(.): \($c[.] // "(none: uses the collective default)")"' <<<"$source"
            echo
          fi

          # What to fill in on a page. A page made in this run is known to be
          # empty, so it gets the videos, the card link to their Instagram and
          # the listed photo. A page that already existed is changed only with
          # fill_existing, only if it was read, only where a field is empty,
          # and never its photo (a creator's own photo may not show yet).
          fill() {  # slug handle photo new|existing
            local cur fields what fbody fcode kind=$4 rc
            if [ "$kind" = new ]; then cur='{}'
            else
              # Without fill_existing or update_photos a real run leaves existing
              # pages unread.
              if [ "$DRY_RUN" != "true" ] && [ "$FILL_EXISTING" != "true" ] && [ "$UPDATE_PHOTOS" != "true" ]; then return; fi
              cur=$(read_page "$1") && rc=0 || rc=$?
              case $rc in
                0) ;;
                # A dry run for someone not created yet: they would be new.
                1) [ "$DRY_RUN" = "true" ] || { echo "  ✗ page not found"; failed=$((failed+1)); return; }
                   cur='{}'; kind=new ;;
                *) echo "  ✗ could not read their page; left as is"; failed=$((failed+1)); return ;;
              esac
            fi
            fields=$(jq -nc --argjson src "$source" --argjson c "$cur" --argjson keys "$VIDEO_KEYS" \
                     --arg ig "https://www.instagram.com/$2/" --arg photo "$3" --arg new "$kind" --arg update "$UPDATE_PHOTOS" --arg fill "$([ "$DRY_RUN" = true ] && echo true || echo "$FILL_EXISTING")" '
              (reduce $keys[] as $k ({}; if (($c[$k] // "") == "") and ($src[$k] != null) then .[$k] = $src[$k] else . end))
              + (if ($c.back_url // "") == "" then {back_url: $ig} else {} end)
              + (if $photo != "" and ($new == "new" or ($update == "true" and ($c.photo_source // "") != $photo)) then {avatar_url: $photo} else {} end)
              | if $new != "new" and $fill != "true" then with_entries(select(.key == "avatar_url")) else . end')
            [ "$fields" = '{}' ] && { echo "  page already set up"; return; }
            what=$(jq -r 'keys | map(if . == "back_url" then "card → Instagram" elif . == "avatar_url" then "photo" else sub("_url$"; "") end) | join(", ")' <<<"$fields")
            if [ "$DRY_RUN" = "true" ]; then
              if [ "$kind" = new ]; then echo "  would set: $what"; return; fi
              # For an existing page: the photo needs update_photos, the rest
              # needs fill_existing.
              local photo_part rest_part
              photo_part=$(jq -r 'if has("avatar_url") then "photo" else "" end' <<<"$fields")
              rest_part=$(jq -r 'del(.avatar_url) | keys | map(if . == "back_url" then "card → Instagram" else sub("_url$"; "") end) | join(", ")' <<<"$fields")
              [ -n "$photo_part" ] && { [ "$UPDATE_PHOTOS" = "true" ] && echo "  would set: photo" || echo "  would set with update_photos: photo"; }
              [ -n "$rest_part" ] && { [ "$FILL_EXISTING" = "true" ] && echo "  would set: $rest_part" || echo "  would set with fill_existing: $rest_part"; }
              return
            fi
            fbody=$(jq -c --arg s "$1" '. + {slug: $s}' <<<"$fields")
            fcode=$(curl -s -o "$work/fill" -w '%{http_code}' -X POST "$SITE/api/creator/links" \
              -H "content-type: application/json" -H "$AUTH" --data "$fbody")
            [ "$fcode" = 200 ] && echo "  set: $what" || { echo "  ✗ page not updated: $fcode $(jq -r '.error // empty' "$work/fill" 2>/dev/null)"; failed=$((failed+1)); }
          }

          created=0; skipped=0; failed=0; seen=' '
          # One reader for the list (accounts/people.mjs, also used by the
          # tests); it refuses unclear lines instead of guessing. Newlines or
          # semicolons separate people (the Actions input box is one line on
          # some browsers).
          while IFS= read -r person; do
            line=$(jq -r '.line' <<<"$person")
            if jq -e 'has("error")' <<<"$person" >/dev/null; then
              echo "✗ '$line' — $(jq -r '.error' <<<"$person")"; failed=$((failed+1)); continue
            fi
            name=$(jq -r '.name' <<<"$person"); email=$(jq -r '.email' <<<"$person")
            password=$(jq -r '.password' <<<"$person"); slug=$(jq -r '.slug' <<<"$person")
            handle=$(jq -r '.handle' <<<"$person"); photo=$(jq -r '.photo // empty' <<<"$person")
            case "$seen" in *" $email "*)
              echo "✗ $name → $email is already used by someone earlier in this list"; failed=$((failed+1)); continue ;;
            esac
            seen="$seen$email "

            if [ "$DRY_RUN" = "true" ]; then
              echo "• $name → $email  link: /c/$slug  photo: ${photo:-none}"
              fill "$slug" "$handle" "$photo" existing; continue
            fi

            body=$(jq -nc --arg e "$email" --arg p "$password" --arg n "$name" --arg s "$slug" --arg h "@$handle" \
              '{email:$e,password:$p,role:"creator",name:$n,creator_slug:$s,handle:$h}')
            code=$(curl -s -o "$work/out" -w '%{http_code}' -X POST "$SITE/api/admin/accounts" \
              -H "content-type: application/json" -H "$AUTH" --data "$body")
            case "$code" in
              200|201)
                echo "✓ $name → $email  link: /c/$slug  photo: ${photo:-none}"; created=$((created+1))
                # A brand-new page comes with an access key. Without one, the
                # sign-in was joined to a page that already existed (the same
                # email had registered it), which is treated as existing.
                if jq -e '.access_key | type == "string"' "$work/out" >/dev/null 2>&1; then
                  fill "$slug" "$handle" "$photo" new
                else
                  echo "  (joined to their existing page)"
                  fill "$slug" "$handle" "$photo" existing
                fi
                ;;
              409)
                # The account is left as it is; with fill_existing its page gets
                # the empty videos and card link filled in.
                echo "– $name → $email already has an account (left as is)"; skipped=$((skipped+1))
                fill "$slug" "$handle" "$photo" existing
                ;;
              *)       echo "✗ $name → $email: $code $(jq -r '.error // empty' "$work/out" 2>/dev/null)"; failed=$((failed+1)) ;;
            esac
          done < "$work/people.jsonl"

          echo
          echo "created: $created  already existed: $skipped  failed: $failed"
          [ "$failed" = 0 ]

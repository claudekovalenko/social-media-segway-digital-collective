name: Deploy Worker to Cloudflare

# Publishes the Worker (backend + API) on every push, so no local
# `wrangler deploy` is needed. Requires a CLOUDFLARE_API_TOKEN repo secret.

on:
  push:
    branches: [claude/know-god-creator-website-vjvm2i]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "830375f1830fccce2dac031f42817b3d"

      # Push app secrets from GitHub repo secrets, so nothing has to be set by
      # hand with wrangler. Each is skipped when its repo secret is empty.
      - name: Sync secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "830375f1830fccce2dac031f42817b3d"
          ADMIN_LOGINS: ${{ secrets.ADMIN_LOGINS }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          AUTH_PROVIDERS: ${{ secrets.AUTH_PROVIDERS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for name in ADMIN_LOGINS ADMIN_KEY ADMIN_EMAILS AUTH_PROVIDERS \
                      SUPABASE_URL SUPABASE_SERVICE_KEY SUPABASE_ANON_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
              echo "set $name"
            else
              echo "skipped $name (no repo secret)"
            fi
          done

name: Deploy Worker to Cloudflare

# Publishes the Worker (backend + API) on every push, so no local
# `wrangler deploy` is needed. Requires a CLOUDFLARE_API_TOKEN repo secret.

on:
  push:
    branches: [claude/know-god-creator-website-vjvm2i]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "830375f1830fccce2dac031f42817b3d"

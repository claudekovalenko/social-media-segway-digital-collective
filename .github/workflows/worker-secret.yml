name: Set a Worker secret

# Run from the Actions tab: puts one secret on one Worker without the value
# ever touching the repository. The value is masked before any step header
# can print it.

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker name
        required: true
        default: jesus-people-dev
        type: choice
        options: [jesus-people-dev, jesus-people-preview, faith-journey-preview, faith-journey-funnel]
      name:
        description: Secret name (e.g. SUPABASE_URL)
        required: true
      value:
        description: Secret value
        required: true

jobs:
  secret:
    runs-on: ubuntu-latest
    steps:
      - name: Mask
        run: echo "::add-mask::${{ inputs.value }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "830375f1830fccce2dac031f42817b3d"
          VALUE: ${{ inputs.value }}
        run: printf '%s' "$VALUE" | npx --yes wrangler@4 secret put "${{ inputs.name }}" --name "${{ inputs.worker }}"
